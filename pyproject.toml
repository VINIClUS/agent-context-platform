[project]
name = "agent-context-platform"
version = "0.1.0"
description = "Authoritative context ledger, projections, retrieval, and MCP service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "agent-context-sdk==0.1.0",
    "alembic>=1.19.1,<2",
    "boto3>=1.43.76,<2",
    "fastapi>=0.141.1,<1",
    "neo4j>=6.2.0,<7",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.12.0,<3",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "uvicorn>=0.40.0,<1",
    "zstandard>=0.25.0,<1",
]

[build-system]
requires = ["uv-build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Starlette 1.6 prefers HTTPX2; installing legacy HTTPX emits a deprecation warning.
    "httpx2>=2.10.0,<3",
    "mypy>=1.19.1,<2",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.14.14,<1",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=agent_context_platform",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
    "unit: isolated tests without external services",
    "integration: tests that cross process or datastore boundaries",
    "contract: tests for public API and schema compatibility",
    "e2e: tests for complete deployed workflows",
]

[tool.coverage.run]
branch = true
source = ["agent_context_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.uv]
required-version = "==0.11.28"

[tool.uv.sources]
agent-context-sdk = { path = "build/sdk/agent_context_sdk-0.1.0-py3-none-any.whl" }

[tool.agent-context.sdk]
repository = "VINIClUS/agent-context-sdk"
version = "0.1.0"
tag = "v0.1.0"
commit = "a9179deb97a0402112a5bf1ebf3ba97ec547aa6c"
wheel-sha256 = "13cf6b39cae0d563e1f8f7ab263674407a81c497aee0f658a92a3a1ff21d3be1"
