[project]
name = "agent-context-platform"
version = "0.1.0"
description = "Authoritative context ledger, projections, retrieval, and MCP service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "agent-context-sdk==0.3.0",
    "alembic>=1.19.1,<2",
    "boto3>=1.43.76,<2",
    "fastapi>=0.141.1,<1",
    "mcp>=2.0.0,<3",
    "neo4j>=6.2.0,<7",
    "opentelemetry-api>=1.45.0,<2",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.12.0,<3",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "uvicorn>=0.40.0,<1",
    "zstandard>=0.25.0,<1",
]

[build-system]
requires = ["uv-build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Starlette 1.6 prefers HTTPX2; installing legacy HTTPX emits a deprecation warning.
    "httpx2>=2.10.0,<3",
    "mypy>=1.19.1,<2",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.14.14,<1",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=agent_context_platform",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
    "unit: isolated tests without external services",
    "integration: tests that cross process or datastore boundaries",
    "contract: tests for public API and schema compatibility",
    "e2e: tests for complete deployed workflows",
]

[tool.coverage.run]
branch = true
source = ["agent_context_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "agent_context_sdk"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# agent-context-sdk (0.2.0 through at least 0.3.0) ships no py.typed
# marker in its wheel even though its own source is fully annotated;
# same treatment as boto3 above.
module = ["agent_context_sdk", "agent_context_sdk.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.uv]
required-version = "==0.11.28"

[tool.uv.sources]
agent-context-sdk = { path = "build/sdk/agent_context_sdk-0.3.0-py3-none-any.whl" }

[tool.agent-context.sdk]
repository = "VINIClUS/agent-context-sdk"
version = "0.3.0"
tag = "v0.3.0"
commit = "74857ccac9d94ac00c281a0a7fb862e83db86341"
wheel-sha256 = "a3b334b850a816dd4dc6345ba3c4800a6dcbbb177f423b14f9fd80b758db4cb6"
