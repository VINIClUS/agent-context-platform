name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Require private SDK token
        env:
          SDK_READ_TOKEN: ${{ secrets.AGENT_CONTEXT_SDK_READ_TOKEN }}
        run: |
          if [ -z "$SDK_READ_TOKEN" ]; then
            echo "::error::AGENT_CONTEXT_SDK_READ_TOKEN is required to download the private SDK release"
            exit 1
          fi

      - name: Read SDK release metadata
        run: |
          uv run --no-project --python "${{ matrix.python-version }}" python <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["agent-context"]["sdk"]
          variables = {
              "SDK_REPOSITORY": metadata["repository"],
              "SDK_VERSION": metadata["version"],
              "SDK_TAG": metadata["tag"],
              "SDK_COMMIT": metadata["commit"],
              "SDK_WHEEL_SHA256": metadata["wheel-sha256"],
              "SDK_WHEEL": f"agent_context_sdk-{metadata['version']}-py3-none-any.whl",
          }
          with Path(os.environ["GITHUB_ENV"]).open("a") as github_env:
              for name, value in variables.items():
                  print(f"{name}={value}", file=github_env)
          PY

      - name: Download private SDK wheel
        env:
          GH_TOKEN: ${{ secrets.AGENT_CONTEXT_SDK_READ_TOKEN }}
        run: |
          mkdir -p build/sdk
          gh release download "$SDK_TAG" \
            --repo "$SDK_REPOSITORY" \
            --pattern "$SDK_WHEEL" \
            --dir build/sdk

      - name: Verify private SDK wheel
        run: echo "$SDK_WHEEL_SHA256  build/sdk/$SDK_WHEEL" | sha256sum --check --strict -

      - name: Verify lockfile
        run: uv lock --check --python "${{ matrix.python-version }}"

      - name: Sync project
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen mypy src

      - name: Test
        run: uv run --frozen pytest -q
