# Conformance applicability manifest (PLATFORM-047). Read by `evaluate.py`; policy in
# docs/mcp/conformance.md. Pinned suite: `conformance.lock`. Citations point into the pinned
# package's `dist/index.js` (one bundled file); `source_literal` must occur in it verbatim and
# `scenario` must be a scenario class of it (the runner checks both).
#
# `[[exclusion]]`: a scored check that exercises only a capability the platform does not
# advertise. Each capability lists the methods that would serve it; tests assert that the shipping
# `server/discover` does not advertise it and that every method answers -32601. A scenario whose
# behaviour is ours (stateless/session, transport security, headers, authorization) can never be
# excluded (`evaluate.PROTECTED`).
#
# `[[fixture]]`: shipping profile only. A scored check that needs one of the suite's fixture tools,
# which the shipping server must never list. It is NOT a waiver: the evaluator requires the same
# check to PASS on the fixture profile, which serves that tool on the shipping transport stack.
#
# A listed check that passes (stale), does not run (missing) or names an unknown scenario fails
# the run, as does any unlisted scored failure. Unscored scenarios are never listed.

[capability.resources]
discover_key = "resources"
methods = ["resources/list", "resources/read", "resources/templates/list"]
description = "Server resources (list, read, templates). The platform serves no resources: evidence resource_uri values are names, not readable resources (mcp/tools.py)."

[capability.prompts]
discover_key = "prompts"
methods = ["prompts/list", "prompts/get"]
description = "Server prompts. The platform serves no prompts."

[capability.completions]
discover_key = "completions"
methods = ["completion/complete"]
description = "Argument completion for prompts and resource templates, which the platform does not serve."

[capability.input_requests]
methods = ["elicitation/create", "sampling/createMessage", "roots/list"]
description = "InputRequiredResult (SEP-2322, MRTR) asking the client for elicitation, sampling or roots. No memory tool needs client input; none of these client features is ever requested."

[capability.response_stream]
methods = ["tools/call"]
description = "SSE response streams carrying request-scoped notifications (progress). The stateless server answers every POST with a single application/json body (json_response=True), so notifications have no wire; Streamable HTTP lets a server answer application/json."

