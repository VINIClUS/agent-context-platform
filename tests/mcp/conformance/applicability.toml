scenario = "resources-list"
checks = ["resources-list"]
profiles = ["shipping", "fixture"]
capability = "resources"
justification = "Calls only resources/list; resources are not served (-32601)."
source = "dist/index.js scenario `resources-list`: requests `resources/list` and checks its result only"
source_literal = '`resources/list`'

